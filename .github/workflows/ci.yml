name: virtdisk CI
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-checks-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: virtdisk
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: virtdisk
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: virtdisk -> target
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked --no-fail-fast

  independent-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: virtdisk
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: virtdisk -> target
      - name: Install QEMU oracle
        run: sudo apt-get update && sudo apt-get install -y qemu-utils
      - run: cargo test --test qcow2 --locked -- --ignored --test-threads=1

  fuzz-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path fuzz/Cargo.toml --locked

  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: virtdisk
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: virtdisk -> target
      - run: cargo clippy --lib --tests --no-default-features --locked -- -D warnings
      - run: cargo test --lib --tests --no-default-features --locked
      - run: cargo check --lib --no-default-features --locked
      - run: cargo check --lib --no-default-features --locked --target x86_64-unknown-none
      - run: cargo tree --no-default-features --target x86_64-unknown-none -e features
      - run: cargo test --manifest-path integration/portable-consumer/Cargo.toml --locked
      - run: cargo test --manifest-path integration/portable-consumer/Cargo.toml --locked --features host-unified
      - run: cargo check --manifest-path integration/portable-consumer/Cargo.toml --locked --target x86_64-unknown-none
      - run: cargo tree --manifest-path integration/portable-consumer/Cargo.toml --locked --target x86_64-unknown-none -e features
      - run: cargo package --locked

[package]
name = "virtdisk"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/CaddyGlow/virtdisk"
description = "Bounded virtual disk readers and offline image operations with explicit writable profiles"

readme = "README.md"
homepage = "https://github.com/CaddyGlow/virtdisk"
keywords = ["qcow2", "disk", "virtual-disk"]
categories = ["filesystem", "parser-implementations"]

[features]
default = ["std"]
std = ["dep:same-file", "dep:getrandom", "dep:rustix", "sha2/std"]
cli = ["std"]

[[bin]]
name = "virtdisk"
path = "src/bin/virtdisk.rs"
required-features = ["cli"]

[dependencies]
same-file = { version = "1.0", optional = true }
getrandom = { version = "0.3", optional = true }
sha2 = { version = "0.10", default-features = false }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"], optional = true }

[dev-dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tempfile = "3.23"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace]
exclude = ["fuzz"]

[profile.release]
lto = "thin"
strip = true
